[workspace]
members = [
    "crates/handycam-core",
    "crates/handycam-libusb",
    "crates/handycam-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hex-literal = "1.0"
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"
rusb = "0.9"
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
v4l = "0.14"
